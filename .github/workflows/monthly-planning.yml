name: Monthly planning panel
on:
  pull_request:
    branches: [main, feat/durable-content-planning]
    paths:
      - '.github/workflows/monthly-planning.yml'
      - 'app/(app)/dashboard/**'
      - 'app/api/monthly-plan/**'
      - 'lib/monthly-planning*'
      - 'supabase/monthly-feature-plans.sql'
      - 'supabase/tests/*monthly-feature-plans*'
      - 'tests/monthly-*'
      - 'tests/fixtures/monthly-*'
      - 'tsconfig.monthly-planning.json'
      - 'package*.json'
permissions:
  contents: read
jobs:
  monthly-browser:
    name: Monthly panel browser and API
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck:monthly-planning
      - run: npm run test:monthly-planning
      - name: Build without production credentials
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://build-only.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-public-placeholder
      - run: npx playwright install --with-deps chromium
      - run: npm run test:monthly-planning:browser
        env:
          MONTHLY_EVIDENCE_DIR: ${{ runner.temp }}/monthly-evidence
      - name: Upload fake-data screenshots and test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: monthly-planning-browser-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/monthly-evidence
          if-no-files-found: error
          retention-days: 7
  monthly-postgres:
    name: Monthly priorities PostgreSQL (${{ matrix.owner }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        owner: [postgres, supabase_admin]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-test-only
          POSTGRES_DB: fireova_content_planning_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fireova_content_planning_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      FIREOVA_TEST_DATABASE_URL: postgresql://postgres:disposable-test-only@127.0.0.1:5432/fireova_content_planning_test
      MIGRATION_OWNER: ${{ matrix.owner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Ensure test database client
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes postgresql-client
          fi
      - run: bash -x supabase/tests/run-monthly-feature-plans.sh
